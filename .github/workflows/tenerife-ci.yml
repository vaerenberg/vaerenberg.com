name: Tenerife PR validation
on:
  pull_request:
    paths:
      - 'src/vaerenberg.com/**'
      - 'scripts/generate-tenerife-invitations.py'
      - '.github/workflows/tenerife-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore and build
        run: dotnet build src/vaerenberg.com/vaerenberg.com.csproj --configuration Release
      - name: Validate invitation generator syntax
        run: python -m py_compile scripts/generate-tenerife-invitations.py
